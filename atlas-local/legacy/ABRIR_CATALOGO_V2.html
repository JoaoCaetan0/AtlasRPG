function validate(p){if(p.format!=='estigma-map-editor'||p.schema!==1||!Array.isArray(p.operations)||p.operations.length>20000)throw Error('Arquivo de edição inválido.');const allowed=['brush','marker','erase','line','arrow','rect','square','triangle','ellipse','circle','hexagon','text'];for(const o of p.operations){if(!allowed.includes(o.type)||!/^#[0-9a-f]{6}$/i.test(o.color)||!Number.isFinite(o.width)||o.width<1||o.width>100||!Number.isFinite(o.opacity)||o.opacity<0||o.opacity>1||!Array.isArray(o.points)||!o.points.length||o.points.length>500000||o.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(v=>!Number.isFinite(v)))||(o.type==='text'&&(typeof o.text!=='string'||o.text.length>250)))throw Error('Anotação inválida.');}return p}

const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});

cc.onpointerdown=e=>{if(e.button!==0||!cs)return;cc.setPointerCapture(e.pointerId);if(space||node.classList.contains('present')){gesture={pan:[e.clientX,e.clientY,viewport.scrollLeft,viewport.scrollTop]};return}const p=point(e),h=hexAt(p);if(cb('Action').value==='paint'){checkpoint();gesture={paint:h};paintCell(h);renderCombat();return}const t=[...cs.tokens].reverse().find(t=>{const c=center(t);return Math.hypot(c[0]-p[0],c[1]-p[1])<=cs.grid.size*.76*t.size});selected=t?.id||null;sync();if(t&&!t.locked)gesture={route:[{q:t.q,r:t.r}],id:t.id,invalid:false};};
cc.onpointermove=e=>{if(!gesture)return;if(gesture.pan){const p=gesture.pan;viewport.scrollLeft=p[2]+p[0]-e.clientX;viewport.scrollTop=p[3]+p[1]-e.clientY;return}const h=hexAt(point(e));if(gesture.paint){for(const cell of line(gesture.paint,h))paintCell(cell);gesture.paint=h;renderCombat();return}const route=gesture.route;if(!route)return;const last=route.at(-1);if(key(last)===key(h))return;for(const cell of line(last,h)){if(route.length>1&&key(cell)===key(route.at(-2)))route.pop();else route.push(cell)}const t=token(),a=assess(route,t);gesture.invalid=a.invalid;cb('Readout').textContent=`${route.length-1} hex. · distância ${((route.length-1)*cs.grid.scale).toFixed(1)} ${cs?.systemRules?.unit||'m'} · custo ${a.spent.toFixed(1)} ${cs?.systemRules?.unit||'m'} · restante ${Math.max(0,t.budget-t.spent-a.spent).toFixed(1)} m${a.invalid?' · '+a.reason:''}`;renderCombat()};
cc.onpointerup=()=>{if(!gesture)return;let message='';if(gesture.route){const t=token(),a=assess(gesture.route,t);if(!a.invalid&&gesture.route.length>1){checkpoint();Object.assign(t,gesture.route.at(-1));t.spent+=a.spent;persist();message=a.dangers?.length?'Perigo atravessado: '+a.dangers.join('; '):''}else if(a.invalid)message=a.reason}if(gesture.paint)persist();gesture=null;sync();if(message){cb('Readout').textContent+=' · '+message;status(message)}};
cc.onpointercancel=()=>{if(gesture?.paint){const old=combatHistory.get(csId)?.pop();if(old){cs=old;persist()}}gesture=null;sync()};
cb('Action').onchange=()=>{gesture=null;cb('Terrain').open=cb('Action').value==='paint';renderCombat()};
function validateScene(v){if(!v||v.format!=='estigma-combat'||v.schema!==1||v.mapId!==current.id||v.width!==canvas.width||v.height!==canvas.height)throw Error('A cena pertence a outro mapa ou tem dimensões diferentes.');const g=v.grid,num=(n,a,b)=>Number.isFinite(n)&&n>=a&&n<=b,col=c=>/^#[0-9a-f]{6}$/i.test(c),cell=h=>Number.isInteger(h.q)&&Number.isInteger(h.r)&&Math.abs(h.q)<10000&&Math.abs(h.r)<10000;if(!g||!num(g.size,16,200)||!num(g.scale,.1,100)||!num(g.alpha,0,1)||!num(g.x,-v.width,v.width)||!num(g.y,-v.height,v.height)||!col(g.color)||!['flat','pointy'].includes(g.orient)||!Array.isArray(v.tokens)||v.tokens.length>300||!v.terrain||Array.isArray(v.terrain)||Object.keys(v.terrain).length>50000)throw Error('Configuração de combate inválida.');const ids=new Set();for(const t of v.tokens){if(!cell(t)||typeof t.id!=='string'||ids.has(t.id)||typeof t.name!=='string'||t.name.length>60||typeof t.number!=='string'||t.number.length>8||!col(t.color)||!num(t.size,.5,4)||!num(t.budget,0,1000)||!num(t.spent,0,1e7)||!['ground','fly','vegetation'].includes(t.mode)||typeof t.image!=='string'||t.image.length>300000||t.image&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(t.image))throw Error('Token inválido.');ids.add(t.id)}for(const [k,t]of Object.entries(v.terrain))if(!/^-?\d{1,5},-?\d{1,5}$/.test(k)||![0,1,2,3].includes(t.cost)||!['ground','vegetation'].includes(t.kind)||typeof t.hazard!=='string'||t.hazard.length>120)throw Error('Terreno inválido.');return v}

function migrateBookConditions(){
 if(cs.conditionCatalogVersion===2)return;
 const aliases={caido:'derrubado',derrubada:'derrubado'},prior=cs.conditionLibrary;
 const extras=prior.filter(c=>!defaultConditions.some(d=>d.id===c.id)&&!aliases[c.id]);
 cs.conditionLibrary=defaultConditions.map(d=>{
  const prev=prior.find(c=>c.id===d.id)||prior.find(c=>aliases[c.id]===d.id);
  if(!prev)return clone(d);
  const legacy=legacyBookConditions.find(c=>c.id===prev.id);
  const value={...clone(d),color:prev.color,icon:prev.icon};
  if(legacy&&prev.name!==legacy.name)value.name=prev.name;
  if(legacy&&prev.description!==legacy.description&&prev.description!==d.description)value.customDescription=prev.description;
  return value;
 }).concat(extras);
 for(const s of [...cs.tokens,...cs.encounter.entries]){
  const merged=new Map();
  for(const a of s.conditions||[]){const id=aliases[a.id]||a.id,existing=merged.get(id);if(existing){existing.secret=existing.secret&&a.secret;existing.stage=Math.max(existing.stage||1,a.stage||1)}else merged.set(id,{...a,id});}
  s.conditions=[...merged.values()];
  for(const a of s.conditions){const d=cs.conditionLibrary.find(c=>c.id===a.id);if(d?.maxStage)a.stage=a.stage||1;else delete a.stage;}
 }
 cs.conditionCatalogVersion=2;
}
